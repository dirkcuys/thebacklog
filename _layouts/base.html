<!DOCTYPE html>
<html class="no-js" lang="en">
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <title>The b(ack)log{% if page.title %} | {{page.title}}{% endif %}</title>
        <meta name="description" content="A collection of writing, projects, thoughts, experiments and other things.">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="alternate" type="application/rss+xml" title="The Backlog" href="https://www.thebacklog.net/rss.xml" />
        <link rel="webmention" href="https://webmention.io/www.thebacklog.net/webmention" />
        <link rel="pingback" href="https://webmention.io/www.thebacklog.net/xmlrpc" />
        <link rel="canonical" href="https://www.thebacklog.net{{page.url}}" />

        <!-- Place favicon.ico and apple-touch-icon.png in the root directory -->

        <link rel="stylesheet" href="{{ site.baseurl }}/css/font-awesome.min.css" />
        <link rel="stylesheet" href="{{ site.baseurl }}/css/syntax.css" />
        <link rel="stylesheet" href="{{ site.baseurl }}/css/site.css" />
        {% if page.styles %}
          {% include {{page.styles}} %}
        {% endif %}
        <script src="{{ site.baseurl }}/js/vendor/modernizr-2.6.2.min.js"></script>
    </head>
    <body itemscope itemtype="http://schema.org/WebPage">

        {{ content }}

        <script src="//ajax.googleapis.com/ajax/libs/jquery/1.10.2/jquery.min.js"></script>
        <script>window.jQuery || document.write('<script src="{{ site.baseurl }}/js/vendor/jquery-1.10.2.min.js"><\/script>')</script>
        <script src="{{ site.baseurl }}/js/foundation.min.js"></script>
        <script>
          $(document).foundation();
        </script>
        {% if page.scripts %}
          {% include {{page.scripts}} %}
        {% endif %}
        {% include google_analytics.html %}
    </body>
</html>
