<html>
<head>
  <style>
    html, body { margin: 0; padding: 0; }
  </style>
</head>
<body>
  <canvas id="canvas" width="100%" height="100%"></canvas>
  <script>


window.addEventListener('load',e => {
  const canvas = document.getElementById("canvas")
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;

  const mid = [Math.random()*canvas.width, Math.random()*canvas.height];
  const ctx = canvas.getContext("2d");

  function drawTri(tl, tr, bm){
    let tmid = [bm[0], tl[1]/2+bm[1]/2];
    let d = Math.sqrt(Math.pow(tmid[0]-mid[0], 2) + Math.pow(tmid[1]-mid[1], 2));
    console.log(d);
    ctx.lineWidth = 4*(2/(1+Math.exp(-d/4000)) -1);
    ctx.beginPath();
    ctx.moveTo(...tl);
    ctx.lineTo(...tr);
    ctx.lineTo(...bm);
    ctx.lineTo(...tl);
    ctx.stroke();
  }

  //ctx.fillStyle = "green";
  //ctx.fillRect(10, 10, 150, 100);
  function triDivide(p1, p2, p3){
    let t1p1 = [p1[0], p1[1]];
    let t1p2 = [p1[0]/2 + p2[0]/2, p1[1]];
    let t1p3 = [p1[0]/2 + p3[0]/2, p1[1]/2 + p3[1]/2];
    drawTri(t1p1, t1p2, t1p3);

    if (Math.abs(t1p2[0] - t1p1[0]) > 15 && Math.random() < 0.2){
      triDivide(t1p1, t1p2, t1p3);
    }

    let t2p1 = t1p2;
    let t2p2 = p2;
    let t2p3 = [p2[0]/2 + p3[0]/2, p2[1]/2 + p3[1]/2];

    drawTri(t2p1, t2p2, t2p3);
    
    if (Math.abs(t2p2[0] - t2p1[0]) > 15 && Math.random() < 0.2){
      triDivide(t2p1, t2p2, t2p3);
    }

    let t3p1 = t1p3;
    let t3p2 = t2p3;
    let t3p3 = p3;
    drawTri(t3p1, t3p2, t3p3);

    if (Math.abs(t3p2[0] - t3p1[0]) > 15 && Math.random() < 0.2){
      triDivide(t3p1, t3p2, t3p3);
    }
  }

  ctx.lineWidth = 3;
  let cw = 100;
  let rh = Math.sqrt(3/4)*cw
  let cols = window.innerWidth/cw;
  let rows = window.innerHeight/rh;
  for (let r=0; r<rows; r++){
    for (let c=0; c<cols; c++){
      ctx.beginPath();
      let p1 = [cw*c + (r%2)*cw*0.5, rh*r];
      let p2 = [p1[0] + cw*0.5, p1[1] + rh];
      let p3 = [p1[0] + cw, p1[1]];
      drawTri(p1, p2, p3);
      if (Math.random() < 0.2){
        triDivide([...p1], [...p3], [...p2]);
        /*ctx.beginPath();
        ctx.moveTo(...p1);
        ctx.lineTo(...p2);
        ctx.lineTo(...p3);
        ctx.lineTo(...p1);
        ctx.fill();*/
      }
    }
  }

})
  </script>
