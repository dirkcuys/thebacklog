---
title: rect
renderer: svg
description: Subdivided rectangles drawn in SVG.
---
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
     html, body { padding: 0; margin: 0; }
    </style>
  </head>
  <body>
    <svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1000 1000"></svg>
    <script>

// lifted from https://stackoverflow.com/a/37411738
function createNode(n, v) {
  let n_ = document.createElementNS("http://www.w3.org/2000/svg", n);
  for (var p in v)
    n_.setAttributeNS(null, p.replace(/[A-Z]/g, function(m, p, o, s) { return "-" + m.toLowerCase(); }), v[p]);
  return n_;
}


function divRect(rect){
  let {x, y, width, height} = rect;
  let nv = 1+Math.random()*Math.max(width, height);
  //`rgb(${Math.random()*255},${Math.random()*255},${Math.random()*255}, 0.9)`
  let cf = () => `rgb(40, 40, 40, ${Math.floor(Math.random()*2)})`;
  if (width > height) {
    return [
      {...rect, width: nv, fill: `rgb(40, 40, 40, ${Math.floor(Math.random()*2)})`},
      {...rect, x:x+nv, width: width-nv, fill: cf()},
    ];
  } else {
    return [
      {...rect, height: nv, fill: cf()},
      {...rect, y:y+nv, height: height-nv, fill: cf()},
    ];
  }
}


window.addEventListener('load',e => {
  let svg = document.querySelector('svg');
  svg.viewBox.baseVal.width = window.innerWidth;
  svg.viewBox.baseVal.height = window.innerHeight;

  let rects = [
    {
      x: 0, y: 0,
      width: window.innerWidth,
      height: window.innerHeight,
      fill: 'black',
    },
  ];

  for (let cnt=0; cnt<1000; cnt++){
    let idx = Math.floor(Math.random()*rects.length);
    let rect = rects[idx];
    //console.log(rect);
    rects[idx] = rects.at(-1);
    rects = [ ...rects.slice(0, -1), ...divRect(rect) ];
  }

  for (let rect of rects){
    svg.appendChild(createNode('rect', {...rect, stroke: 'none'}));
  }

})
    </script>
    {% include google_analytics.html %}
  </body>
</html>
